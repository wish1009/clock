<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10초 타이머</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts for crisp fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .font-mono-timer {
      font-family: 'JetBrains Mono', monospace;
    }
    /* SVG Circle Transition */
    .progress-ring-circle {
      transition: stroke-dashoffset 0.05s linear;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }
    /* Pulse glow effect for running state */
    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 15px rgba(99, 102, 241, 0.4)); }
      50% { filter: drop-shadow(0 0 25px rgba(99, 102, 241, 0.7)); }
    }
    .timer-glow {
      animation: pulse-glow 2s infinite ease-in-out;
    }
    /* Completion flash effect */
    @keyframes finish-flash {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }
    .finish-anim {
      animation: finish-flash 0.5s ease-in-out 3;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 overflow-x-hidden select-none">

  <!-- Canvas for completion particle animation -->
  <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-50"></canvas>

  <!-- Header -->
  <header class="w-full max-w-md flex justify-between items-center py-2 px-1">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-lg shadow-lg shadow-indigo-500/30">
        ⏱️
      </div>
      <h1 class="text-xl font-bold tracking-tight text-white">10초 타이머</h1>
    </div>
    <div class="flex items-center space-x-2">
      <!-- HTML Download Button -->
      <button id="download-btn" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors duration-200" title="HTML 파일 다운로드">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
        </svg>
      </button>
      <button id="sound-toggle" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors duration-200" title="음소거 토글">
        <svg id="sound-on-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
        </svg>
        <svg id="sound-off-icon" class="w-5 h-5 hidden text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Content Card -->
  <main class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 sm:p-8 my-auto shadow-2xl flex flex-col items-center">
    
    <!-- Circular Ring with Digital Timer -->
    <div class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center my-4">
      <svg class="w-full h-full transform -rotate-90" viewBox="0 0 200 200">
        <!-- Track circle -->
        <circle
          cx="100"
          cy="100"
          r="88"
          class="stroke-slate-800"
          stroke-width="12"
          fill="transparent"
        />
        <!-- Dynamic Progress circle -->
        <circle
          id="progress-circle"
          cx="100"
          cy="100"
          r="88"
          class="progress-ring-circle stroke-indigo-500"
          stroke-width="12"
          stroke-linecap="round"
          fill="transparent"
          stroke-dasharray="552.92"
          stroke-dashoffset="0"
        />
      </svg>

      <!-- Center Display Text -->
      <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
        <span id="timer-display" class="text-6xl sm:text-7xl font-extrabold font-mono-timer tracking-tight text-white drop-shadow-md">
          10.0
        </span>
        <span id="timer-subtext" class="text-xs uppercase tracking-widest text-indigo-400 font-semibold mt-2">
          초 타이머
        </span>
      </div>
    </div>

    <!-- Primary Controls (Start / Pause / Reset) -->
    <div class="flex items-center space-x-4 w-full mt-4 justify-center">
      <!-- Reset Button -->
      <button
        id="reset-btn"
        class="flex-1 py-3.5 px-4 rounded-2xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 font-semibold transition-all duration-150 flex items-center justify-center space-x-2 border border-slate-700/50 shadow-md"
      >
        <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        </svg>
        <span>초기화</span>
      </button>

      <!-- Start / Pause Toggle Button -->
      <button
        id="start-btn"
        class="flex-[1.5] py-3.5 px-6 rounded-2xl bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-bold transition-all duration-150 flex items-center justify-center space-x-2 shadow-lg shadow-indigo-600/30 border border-indigo-400/30"
      >
        <svg id="start-icon" class="w-6 h-6 fill-current" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
        <svg id="pause-icon" class="w-6 h-6 fill-current hidden" viewBox="0 0 24 24">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
        <span id="start-btn-text">시작</span>
      </button>
    </div>

    <!-- Time Adjustment (+/- 1s, +5s) -->
    <div class="grid grid-cols-3 gap-2 w-full mt-4">
      <button id="add-minus-1" class="py-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-sm font-semibold transition active:scale-95 border border-slate-700/30">
        -1초
      </button>
      <button id="add-plus-1" class="py-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-sm font-semibold transition active:scale-95 border border-slate-700/30">
        +1초
      </button>
      <button id="add-plus-5" class="py-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-sm font-semibold transition active:scale-95 border border-slate-700/30">
        +5초
      </button>
    </div>

    <!-- Presets Selector -->
    <div class="w-full mt-6 pt-5 border-t border-slate-800/80">
      <div class="text-xs font-semibold text-slate-400 mb-2.5 text-center">자주 쓰는 시간 선택</div>
      <div class="flex flex-wrap gap-2 justify-center">
        <button class="preset-btn px-3 py-1.5 rounded-lg bg-slate-800/50 hover:bg-indigo-900/50 hover:text-indigo-300 border border-slate-700/50 text-xs font-medium text-slate-300 transition" data-seconds="5">5초</button>
        <button class="preset-btn px-3 py-1.5 rounded-lg bg-indigo-600/30 border border-indigo-500/50 text-indigo-200 text-xs font-semibold transition" data-seconds="10">10초</button>
        <button class="preset-btn px-3 py-1.5 rounded-lg bg-slate-800/50 hover:bg-indigo-900/50 hover:text-indigo-300 border border-slate-700/50 text-xs font-medium text-slate-300 transition" data-seconds="15">15초</button>
        <button class="preset-btn px-3 py-1.5 rounded-lg bg-slate-800/50 hover:bg-indigo-900/50 hover:text-indigo-300 border border-slate-700/50 text-xs font-medium text-slate-300 transition" data-seconds="30">30초</button>
        <button class="preset-btn px-3 py-1.5 rounded-lg bg-slate-800/50 hover:bg-indigo-900/50 hover:text-indigo-300 border border-slate-700/50 text-xs font-medium text-slate-300 transition" data-seconds="60">1분</button>
      </div>
    </div>
  </main>

  <!-- Footer & Shortcuts Info -->
  <footer class="text-center text-xs text-slate-500 my-2">
    <span>단축키: <kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-300 font-mono">Space</kbd> 시작/일시정지 | <kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-300 font-mono">R</kbd> 초기화</span>
  </footer>

  <script>
    // State Variables
    let totalSeconds = 10;
    let remainingTime = 10; // in seconds
    let isRunning = false;
    let timerInterval = null;
    let lastTimestamp = null;
    let isSoundMuted = false;

    // SVG Ring Calculations
    const circle = document.getElementById('progress-circle');
    const radius = circle.r.baseVal.value;
    const circumference = 2 * Math.PI * radius; // Approx 552.92
    circle.style.strokeDasharray = `${circumference} ${circumference}`;

    // DOM Elements
    const timerDisplay = document.getElementById('timer-display');
    const timerSubtext = document.getElementById('timer-subtext');
    const startBtn = document.getElementById('start-btn');
    const startIcon = document.getElementById('start-icon');
    const pauseIcon = document.getElementById('pause-icon');
    const startBtnText = document.getElementById('start-btn-text');
    const resetBtn = document.getElementById('reset-btn');
    const presetBtns = document.querySelectorAll('.preset-btn');
    const soundToggle = document.getElementById('sound-toggle');
    const soundOnIcon = document.getElementById('sound-on-icon');
    const soundOffIcon = document.getElementById('sound-off-icon');
    const downloadBtn = document.getElementById('download-btn');

    // Web Audio API Context for Zero-Dependency Sound Synthesizer
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          audioCtx = new AudioContext();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Play crisp tick sound
    function playTickSound() {
      if (isSoundMuted) return;
      initAudio();
      if (!audioCtx) return;

      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.05);

        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } catch (e) {
        console.error(e);
      }
    }

    // Play completion fanfare sound
    function playFinishSound() {
      if (isSoundMuted) return;
      initAudio();
      if (!audioCtx) return;

      try {
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.1);

          gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.1 + 0.4);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(audioCtx.currentTime + idx * 0.1);
          osc.stop(audioCtx.currentTime + idx * 0.1 + 0.4);
        });
      } catch (e) {
        console.error(e);
      }
    }

    // Update Display Text and Progress Ring
    let lastSecondInt = Math.ceil(remainingTime);

    function updateDisplay() {
      // Format number to 1 decimal place if < 10 or exact format
      if (remainingTime <= 0) {
        timerDisplay.textContent = '0.0';
      } else {
        timerDisplay.textContent = remainingTime.toFixed(1);
      }

      // Progress fraction
      const fraction = Math.max(0, remainingTime / totalSeconds);
      const offset = circumference - (fraction * circumference);
      circle.style.strokeDashoffset = offset;

      // Color shifts based on time remaining
      if (fraction > 0.5) {
        circle.classList.remove('stroke-amber-500', 'stroke-rose-500');
        circle.classList.add('stroke-indigo-500');
      } else if (fraction > 0.2) {
        circle.classList.remove('stroke-indigo-500', 'stroke-rose-500');
        circle.classList.add('stroke-amber-500');
      } else {
        circle.classList.remove('stroke-indigo-500', 'stroke-amber-500');
        circle.classList.add('stroke-rose-500');
      }

      // Tick sound every integer second boundary
      const currentSecondInt = Math.ceil(remainingTime);
      if (isRunning && currentSecondInt !== lastSecondInt && remainingTime > 0) {
        playTickSound();
        lastSecondInt = currentSecondInt;
      }
    }

    // Main Timer Tick Loop using High Resolution Time Delta
    function step(timestamp) {
      if (!isRunning) return;

      if (!lastTimestamp) lastTimestamp = timestamp;
      const deltaTime = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      remainingTime -= deltaTime;

      if (remainingTime <= 0) {
        remainingTime = 0;
        updateDisplay();
        onTimerComplete();
        return;
      }

      updateDisplay();
      timerInterval = requestAnimationFrame(step);
    }

    // Start Timer Function
    function startTimer() {
      initAudio();
      if (remainingTime <= 0) {
        remainingTime = totalSeconds;
      }
      isRunning = true;
      lastTimestamp = performance.now();
      
      // UI Updates
      startIcon.classList.add('hidden');
      pauseIcon.classList.remove('hidden');
      startBtnText.textContent = '일시정지';
      startBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-500', 'shadow-indigo-600/30');
      startBtn.classList.add('bg-amber-600', 'hover:bg-amber-500', 'shadow-amber-600/30');
      timerSubtext.textContent = '진행 중...';

      timerInterval = requestAnimationFrame(step);
    }

    // Pause Timer Function
    function pauseTimer() {
      isRunning = false;
      if (timerInterval) {
        cancelAnimationFrame(timerInterval);
        timerInterval = null;
      }
      lastTimestamp = null;

      // UI Updates
      pauseIcon.classList.add('hidden');
      startIcon.classList.remove('hidden');
      startBtnText.textContent = '계속';
      startBtn.classList.remove('bg-amber-600', 'hover:bg-amber-500', 'shadow-amber-600/30');
      startBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-500', 'shadow-indigo-600/30');
      timerSubtext.textContent = '일시정지됨';
    }

    // Reset Timer Function
    function resetTimer() {
      pauseTimer();
      remainingTime = totalSeconds;
      lastSecondInt = Math.ceil(totalSeconds);
      startBtnText.textContent = '시작';
      timerSubtext.textContent = `${totalSeconds}초 타이머`;
      
      // Remove finishing styles if any
      timerDisplay.classList.remove('text-rose-400', 'finish-anim');
      updateDisplay();
    }

    // Timer Completion Event
    function onTimerComplete() {
      pauseTimer();
      startBtnText.textContent = '다시 시작';
      timerSubtext.textContent = '시간 완료!';
      timerDisplay.classList.add('text-rose-400', 'finish-anim');

      playFinishSound();
      launchConfetti();
    }

    // Lightweight Confetti Particle System
    function launchConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const particleCount = 70;
      const colors = ['#6366f1', '#a855f7', '#ec4899', '#3b82f6', '#10b981', '#f59e0b'];

      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 0.7) * 14,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 10,
          opacity: 1
        });
      }

      function renderConfetti() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let activeParticles = 0;

        particles.forEach(p => {
          if (p.opacity <= 0) return;
          activeParticles++;

          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.3; // Gravity
          p.rotation += p.rotationSpeed;
          p.opacity -= 0.015;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.globalAlpha = Math.max(0, p.opacity);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        });

        if (activeParticles > 0) {
          requestAnimationFrame(renderConfetti);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      requestAnimationFrame(renderConfetti);
    }

    // Event Listeners for Buttons
    startBtn.addEventListener('click', () => {
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    });

    resetBtn.addEventListener('click', resetTimer);

    // Preset Buttons Listener
    presetBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        const secs = parseInt(e.target.getAttribute('data-seconds'), 10);
        
        // Update active preset styling
        presetBtns.forEach(b => {
          b.className = 'preset-btn px-3 py-1.5 rounded-lg bg-slate-800/50 hover:bg-indigo-900/50 hover:text-indigo-300 border border-slate-700/50 text-xs font-medium text-slate-300 transition';
        });
        btn.className = 'preset-btn px-3 py-1.5 rounded-lg bg-indigo-600/30 border border-indigo-500/50 text-indigo-200 text-xs font-semibold transition';

        totalSeconds = secs;
        resetTimer();
      });
    });

    // Quick Add/Subtract Buttons
    document.getElementById('add-minus-1').addEventListener('click', () => {
      if (remainingTime > 1) {
        remainingTime -= 1;
        totalSeconds = Math.max(1, totalSeconds - 1);
        updateDisplay();
      }
    });

    document.getElementById('add-plus-1').addEventListener('click', () => {
      remainingTime += 1;
      totalSeconds += 1;
      updateDisplay();
    });

    document.getElementById('add-plus-5').addEventListener('click', () => {
      remainingTime += 5;
      totalSeconds += 5;
      updateDisplay();
    });

    // Sound Mute Toggle
    soundToggle.addEventListener('click', () => {
      isSoundMuted = !isSoundMuted;
      if (isSoundMuted) {
        soundOnIcon.classList.add('hidden');
        soundOffIcon.classList.remove('hidden');
      } else {
        soundOffIcon.classList.add('hidden');
        soundOnIcon.classList.remove('hidden');
      }
    });

    // Download HTML Code Function
    downloadBtn.addEventListener('click', () => {
      const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '10sec-timer.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        startBtn.click();
      } else if (e.code === 'KeyR') {
        e.preventDefault();
        resetBtn.click();
      }
    });

    // Resize canvas dynamically
    window.addEventListener('resize', () => {
      const canvas = document.getElementById('confetti-canvas');
      if (canvas) {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
    });

    // Initial render
    updateDisplay();
  </script>
</body>
</html>
